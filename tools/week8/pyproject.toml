[project]
name = "week8-finalization-tools"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pillow>=11,<13",
  "pypdfium2>=4.30,<5",
  "pytest==8.4.1",
  "python-docx>=1.2,<2",
  "reportlab>=4,<5",
  "tomli>=2,<3; python_version < '3.11'",
  "vulture==2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
