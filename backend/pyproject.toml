[project]
name = "content-retrieval-backend"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "pypdfium2>=4.30,<5",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=5,<6",
    "torch>=2.9,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "unit: isolated test without a real network service or external process",
    "integration: integration across a process, service, or runtime boundary",
    "e2e: complete application pipeline test",
    "stress: large-library load or soak test",
    "requires_models: requires real local model assets",
    "requires_tika: requires a real Apache Tika service",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
