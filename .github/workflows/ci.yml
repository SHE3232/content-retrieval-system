name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and release policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked public dependencies
        run: uv sync --project backend --locked
      - name: Run backend tests without external assets
        run: >-
          uv run --project backend python -m pytest backend/tests
          -m "not requires_models and not requires_tika and not stress"
      - name: Run Week 8 source and release policy tests
        run: >-
          uv run --project tools/week8 --locked python -m pytest
          tools/week8/tests -q
      - name: Run open-source compliance tests
        run: uv run --project backend python -m pytest tools/compliance/tests -q
      - name: Run deterministic demo-material tests
        run: uv run --project backend python -m pytest tools/demo/tests -q

  windows-policy:
    name: Windows launcher and packaging policy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: >-
          uv run --project tools/week8 --locked python -m pytest
          tools/week8/tests/test_build_windows_release.py -q

  frontend:
    name: Flutter static analysis and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
