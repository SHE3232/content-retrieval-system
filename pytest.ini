[pytest]
python_files = test_*.py
pythonpath = backend/src
markers =
    unit: isolated test without a real network service or external process
    integration: integration across a process, service, or runtime boundary
    e2e: complete application pipeline test
    stress: large-library load or soak test
    requires_models: requires real local model assets
    requires_tika: requires a real Apache Tika service
testpaths =
    backend/tests
    datasets
    model-tools
    conversion-tools
